[flavor_groups.sodium]
name = "Sodium"
description = "Rendering optimization mod, may cause visual issues with some effects. Recommended only to use if needed. Client only."
side = "client"
[[flavor_groups.sodium.choices]]
id = "sodium_on"
name = "Yes"
description = "Installs Sodium."
[[flavor_groups.sodium.choices]]
id = "sodium_off"
name = "No"
description = "Do not install Sodium."

[flavor_groups.figura]
name = "Figura"
description = "Animation-capable player models that come directly from Blockbench, with near unlimited capabilities for customization. Client only."
side = "client"
[[flavor_groups.figura.choices]]
id = "figura_on"
name = "Yes"
description = "Installs Figura."
[[flavor_groups.figura.choices]]
id = "figura_off"
name = "No"
description = "Do not install Figura."

[flavor_groups.mousetweaks]
name = "Mouse Tweaks"
description = "Basic QoL mod to allow easily click-drag grabbing and even depositing of items as well as scrolling items between inventories."
side = "both"
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_on"
name = "Yes"
description = "Installs Mouse Tweaks."
[[flavor_groups.mousetweaks.choices]]
id = "mousetweaks_off"
name = "No"
description = "Do not install Mouse Tweaks."

[flavor_groups.now-playing]
name = "Now Playing"
description = "When currently playing music changes, shows a small popup with the name of that music"
side = "client"
[[flavor_groups.now-playing.choices]]
id = "now-playing_on"
name = "Yes"
description = "Installs Now Playing."
[[flavor_groups.now-playing.choices]]
id = "now-playing_off"
name = "No"
description = "Do not install Now Playing."


[metafile.sodium]
flavors = "sodium_on"
[metafile.figura]
flavors = "figura_on"
[metafile.mouse-tweaks]
flavors = "mousetweaks_on"
[metafile.now-playing]
flavors = "now-playing_on"